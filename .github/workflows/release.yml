name: Build & Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (example: 1.2.3). Leave empty for automatic CI version."
        required: false
        type: string

permissions:
  contents: write

env:
  APP_NAME: pixalpeek
  GO_VERSION: "1.26"
  WAILS_VERSION: "v3.0.0-beta.2"
  NODE_VERSION: "22"

jobs:

  # ═══════════════════════════════════════════════════════
  # Resolve version
  # ═══════════════════════════════════════════════════════

  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve application version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+)*([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi
          echo "Resolved version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  # ═══════════════════════════════════════════════════════
  # Windows
  # ═══════════════════════════════════════════════════════

  build-windows:
    name: Windows ${{ matrix.arch }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: windows-latest
            os_name: windows
          - arch: arm64
            os: windows-11-arm
            os_name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install MinGW
        if: matrix.arch == 'amd64'
        shell: pwsh
        run: choco install mingw -y --no-progress

      - name: Configure ARM64 compiler
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          echo "CC=clang" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "CXX=clang++" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download Go dependencies
        run: go mod download

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build Windows binary
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "1"
          go build `
            -tags desktop,production `
            -ldflags "-s -w -X 'github.com/rkriad585/PixalPeek/internal/cli.Version=${{ needs.version.outputs.version }}'" `
            -o "dist/${{ env.APP_NAME }}.exe" `
            .

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build NSIS installer
        shell: pwsh
        run: |
          makensis `
            /DAPP_VERSION="${{ needs.version.outputs.version }}" `
            /DAPP_NAME="${{ env.APP_NAME }}" `
            /DAPP_ARCH="${{ matrix.arch }}" `
            build/windows/installer.nsi

      - name: Normalize artifact name
        id: installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "." -Filter "*.exe" -File |
            Where-Object { $_.FullName -notlike "*\dist\${{ env.APP_NAME }}.exe" } |
            Select-Object -First 1
          if (!$installer) {
            Write-Error "NSIS installer was not found."
            exit 1
          }
          $output = "dist/${{ env.APP_NAME }}-${{ matrix.os_name }}-${{ matrix.arch }}.exe"
          Move-Item $installer.FullName $output -Force
          Write-Host "Installer: $output"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/${{ env.APP_NAME }}-${{ matrix.os_name }}-${{ matrix.arch }}.exe
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════
  # macOS
  # ═══════════════════════════════════════════════════════

  build-macos:
    name: macOS ${{ matrix.arch }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-latest
            os_name: darwin
          - arch: amd64
            os: macos-latest
            os_name: darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download Go dependencies
        run: go mod download

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build macOS binary
        shell: bash
        run: |
          set -euo pipefail
          export CGO_ENABLED=1
          export GOOS=darwin
          export GOARCH="${{ matrix.arch }}"
          go build \
            -tags desktop,production \
            -ldflags "-s -w -X 'github.com/rkriad585/PixalPeek/internal/cli.Version=${{ needs.version.outputs.version }}'" \
            -o "dist/${{ env.APP_NAME }}-darwin-${{ matrix.arch }}" \
            .

      - name: Create application bundle
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="dist/PixalPeek.app"
          rm -rf "$APP_DIR"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"
          cp "dist/${{ env.APP_NAME }}-darwin-${{ matrix.arch }}" "$APP_DIR/Contents/MacOS/${{ env.APP_NAME }}"
          chmod 755 "$APP_DIR/Contents/MacOS/${{ env.APP_NAME }}"
          cp build/appicon.png "$APP_DIR/Contents/Resources/appicon.png"
          cp build/macos/Info.plist "$APP_DIR/Contents/Info.plist"

      - name: Create DMG
        shell: bash
        run: |
          set -euo pipefail
          hdiutil create \
            -volname "PixalPeek" \
            -srcfolder "dist/PixalPeek.app" \
            -ov \
            -format UDZO \
            "dist/${{ env.APP_NAME }}-${{ matrix.os_name }}-${{ matrix.arch }}.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/${{ env.APP_NAME }}-${{ matrix.os_name }}-${{ matrix.arch }}.dmg
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════
  # Linux
  # ═══════════════════════════════════════════════════════

  build-linux:
    name: Linux ${{ matrix.arch }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
            os_name: linux
          - arch: arm64
            os: ubuntu-24.04-arm
            os_name: arm-linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev

      - name: Verify GTK/WebKitGTK
        shell: bash
        run: |
          set -euo pipefail
          echo "GTK4: $(pkg-config --modversion gtk4)"
          echo "WebKitGTK: $(pkg-config --modversion webkitgtk-6.0)"

      - name: Download Go dependencies
        run: go mod download

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build Linux binary
        shell: bash
        run: |
          set -euo pipefail
          export CGO_ENABLED=1
          export GOOS=linux
          export GOARCH="${{ matrix.arch }}"
          go build \
            -tags desktop,production \
            -ldflags "-s -w -X 'github.com/rkriad585/PixalPeek/internal/cli.Version=${{ needs.version.outputs.version }}'" \
            -o "dist/${{ env.APP_NAME }}" \
            .

      - name: Build Debian package
        shell: bash
        run: |
          set -euo pipefail
          DEB_DIR="dist/deb-pkg"
          DEB_OUT="dist/${{ env.APP_NAME }}-${{ matrix.os_name }}-${{ matrix.arch }}.deb"
          VERSION_CLEAN="${{ needs.version.outputs.version }}"
          VERSION_CLEAN="${VERSION_CLEAN#v}"
          VERSION_CLEAN="${VERSION_CLEAN//-/.}"
          rm -rf "$DEB_DIR"
          mkdir -p "$DEB_DIR/DEBIAN" "$DEB_DIR/usr/local/bin"
          cp "dist/${{ env.APP_NAME }}" "$DEB_DIR/usr/local/bin/${{ env.APP_NAME }}"
          chmod 755 "$DEB_DIR/usr/local/bin/${{ env.APP_NAME }}"
          SIZE_KB=$(du -k "dist/${{ env.APP_NAME }}" | cut -f1)
          cat > "$DEB_DIR/DEBIAN/control" <<EOF
          Package: ${{ env.APP_NAME }}
          Version: ${VERSION_CLEAN}
          Section: utils
          Priority: optional
          Architecture: ${{ matrix.arch }}
          Maintainer: rkriad585 <rkriad585@gmail.com>
          Homepage: https://rkriad585.github.io/PixalPeek
          Installed-Size: ${SIZE_KB}
          Description: Dot-matrix QR code scanner and generator
           PixalPeek is a dual-mode QR code tool with a GUI and CLI.
           Supports scanning, generating, batch processing, camera scan,
           clipboard decoding, and more.
          EOF
          dpkg-deb --build "$DEB_DIR" "$DEB_OUT"

      - name: Build RPM package
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y rpm
          RPM_DIR="dist/rpm-build"
          RPM_OUT="dist/${{ env.APP_NAME }}-${{ matrix.os_name }}-${{ matrix.arch }}.rpm"
          VERSION_CLEAN="${{ needs.version.outputs.version }}"
          VERSION_CLEAN="${VERSION_CLEAN#v}"
          VERSION_CLEAN="${VERSION_CLEAN//-/.}"
          rm -rf "$RPM_DIR"
          mkdir -p "$RPM_DIR/BUILD" "$RPM_DIR/RPMS" "$RPM_DIR/SOURCES" "$RPM_DIR/SPECS" "$RPM_DIR/SRPMS"
          cat > "$RPM_DIR/SPECS/${{ env.APP_NAME }}.spec" <<EOF
          Name:           ${{ env.APP_NAME }}
          Version:        ${VERSION_CLEAN}
          Release:        1%{?dist}
          Summary:        Dot-matrix QR code scanner and generator
          License:        MIT
          URL:            https://rkriad585.github.io/PixalPeek
          BuildArch:      ${{ matrix.arch }}

          %description
          PixalPeek is a dual-mode QR code tool with a GUI and full CLI.

          %install
          mkdir -p %{buildroot}/usr/local/bin
          cp "${PWD}/dist/${{ env.APP_NAME }}" %{buildroot}/usr/local/bin/${{ env.APP_NAME }}
          chmod 755 %{buildroot}/usr/local/bin/${{ env.APP_NAME }}

          %files
          /usr/local/bin/${{ env.APP_NAME }}

          %changelog
          * $(date "+%a %b %d %Y") rkriad585 <rkriad585@gmail.com> - ${VERSION_CLEAN}-1
          - Initial RPM release
          EOF
          rpmbuild -bb "$RPM_DIR/SPECS/${{ env.APP_NAME }}.spec" --define "_topdir ${PWD}/${RPM_DIR}"
          RPM_FILE=$(find "$RPM_DIR/RPMS" -type f -name "*.rpm" | head -n 1)
          if [[ -n "$RPM_FILE" ]]; then
            cp "$RPM_FILE" "$RPM_OUT"
          fi

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/${{ env.APP_NAME }}-${{ matrix.os_name }}-${{ matrix.arch }}.deb
            dist/${{ env.APP_NAME }}-${{ matrix.os_name }}-${{ matrix.arch }}.rpm
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════
  # Android
  # ═══════════════════════════════════════════════════════

  build-android:
    name: Android ${{ matrix.arch }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - armeabi-v7a
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Linux build dependencies for wails3 CLI
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev

      - name: Download Go dependencies
        run: go mod download

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          wails3 build \
            -platform "android/${{ matrix.arch }}" \
            -o "dist/${{ env.APP_NAME }}-android-${{ matrix.arch }}.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.arch }}
          path: dist/${{ env.APP_NAME }}-android-${{ matrix.arch }}.apk
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════
  # Release
  # ═══════════════════════════════════════════════════════

  release:
    name: GitHub Release
    needs:
      - version
      - build-windows
      - build-macos
      - build-linux
      - build-android
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release artifacts
        shell: bash
        run: find artifacts -type f -maxdepth 2 -print | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: "PixalPeek ${{ needs.version.outputs.version }}"
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            artifacts/${{ env.APP_NAME }}-windows-amd64.exe
            artifacts/${{ env.APP_NAME }}-windows-arm64.exe
            artifacts/${{ env.APP_NAME }}-darwin-arm64.dmg
            artifacts/${{ env.APP_NAME }}-darwin-amd64.dmg
            artifacts/${{ env.APP_NAME }}-linux-amd64.deb
            artifacts/${{ env.APP_NAME }}-linux-amd64.rpm
            artifacts/${{ env.APP_NAME }}-arm-linux-arm64.deb
            artifacts/${{ env.APP_NAME }}-arm-linux-arm64.rpm
            artifacts/${{ env.APP_NAME }}-android-arm64.apk
            artifacts/${{ env.APP_NAME }}-android-armeabi-v7a.apk
